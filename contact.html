<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre em contato com Éria Alencar para projetos de produto, UI/UX, ID, design visual e embalagem.">
  <title>Contato | Éria Alencar</title>
  <meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    form { display: flex; flex-direction: column; gap: 2rem; max-width: 600px; margin-top: 3rem; }
    input, textarea {
      background: transparent; border: none; border-bottom: 2px solid var(--border-color);
      padding: 1rem 0; font-family: inherit; font-size: 1.5rem; outline: none;
      color: var(--text-color);
    }
    input:focus, textarea:focus { border-color: var(--accent-color); }
    button[type="submit"] {
      background: var(--text-color); color: var(--bg-color); border: 1px solid var(--border-color);
      padding: 1.25rem; font-family: var(--font-body); font-weight: 600; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.04em;
      transition: background 0.2s ease, color 0.2s ease;
    }
    button[type="submit"]:hover {
      background: var(--accent-color);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <div class="id-stack">
      <a href="index.html" class="tag">Éria Alencar</a>
      <span class="tag">Designer Multidisciplinar</span>
      <span class="tag">Baseada em Goiás&nbsp;|&nbsp;BR</span>
      <span class="tag tag-map" role="img" aria-label="Mapa de Goiás">
        <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M20 18 L34 22 L40 14 L52 18 L60 6 L70 10 L74 20 L66 28 L76 34 L80 46 L72 54 L78 64 L70 72 L60 78 L54 88 L44 82 L38 90 L28 84 L20 74 L26 62 L14 50 L22 38 L16 28 Z M58 38 L70 38 L70 46 L58 46 Z"/>
        </svg>
      </span>
    </div>

    <nav class="nav-stack" aria-label="Navegação principal">
      <a href="index.html" class="tag">Home</a>
      <a href="projects.html" class="tag">Projetos</a>
      <a href="about.html" class="tag">Sobre</a>
      <a href="contact.html" class="tag active">Contato</a>
      <button type="button" id="themeToggle" class="tag theme-toggle" aria-label="Alternar modo de cor" title="Modo de cor">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/>
        </svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
    </nav>
  </header>

  <main class="main-wrapper p-2" style="padding-top: 10rem;">
    <p class="eyebrow" style="margin-bottom: 1.5rem;">Vamos conversar</p>
    <h1 class="h1-brutal">Fale<br><em>Comigo</em></h1>

    <!-- TROQUE O SEU ENDPOINT DO FORMSPREE ABAIXO -->
    <form action="https://formspree.io/f/seu-endpoint-aqui" method="POST">
      <input type="text" name="name" placeholder="Seu Nome" required>
      <input type="email" name="email" placeholder="Seu Email" required>
      <textarea name="message" rows="3" placeholder="Sua Mensagem" required></textarea>
      <button type="submit">Enviar mensagem →</button>
    </form>
  </main>

  <footer>
    <a href="mailto:seuemail@dominio.com">Vamos Conversar ↗</a>
    <span class="footer-note">© 2026 Éria Alencar — feito à mão em Goiás.</span>
  </footer>

  <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
