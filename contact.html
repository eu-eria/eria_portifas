<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre em contato com Éria Alencar para projetos de produto, UI/UX, ID, design visual e embalagem.">
  <title>Contato | Éria Alencar</title>
  <meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    form { display: flex; flex-direction: column; gap: 2rem; max-width: 600px; margin-top: 4rem; }
    input, textarea {
      background: transparent; border: none; border-bottom: 2px solid var(--border-color);
      padding: 1rem 0; font-family: inherit; font-size: 1.5rem; outline: none; border-radius: 0;
      color: var(--text-color);
    }
    input:focus, textarea:focus { border-color: var(--accent-color); }
    button[type="submit"] {
      background: var(--text-color); color: var(--bg-color); border: 1px solid var(--border-color);
      padding: 1.5rem; font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase;
      box-shadow: 5px 5px 0 var(--accent-color);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s;
    }
    button[type="submit"]:hover {
      background: var(--accent-color);
      color: #ffffff;
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--text-color);
    }
  </style>
</head>
<body>
  <header>
    <!-- Canto superior esquerdo: identidade em pilha de tags -->
    <div class="id-stack">
      <a href="index.html" class="tag">Éria Alencar</a>
      <span class="tag">Designer Multidisciplinar</span>
      <span class="tag">Baseada em Goiás&nbsp;|&nbsp;BR</span>
      <span class="tag tag-map" role="img" aria-label="Mapa de Goiás">
        <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M20 18 L34 22 L40 14 L52 18 L60 6 L70 10 L74 20 L66 28 L76 34 L80 46 L72 54 L78 64 L70 72 L60 78 L54 88 L44 82 L38 90 L28 84 L20 74 L26 62 L14 50 L22 38 L16 28 Z M58 38 L70 38 L70 46 L58 46 Z"/>
        </svg>
      </span>
    </div>

    <!-- Canto superior direito: navegação em pilha de tags -->
    <nav class="nav-stack" aria-label="Navegação principal">
      <a href="index.html" class="tag">Home</a>
      <a href="projects.html" class="tag">Projetos</a>
      <a href="about.html" class="tag">Sobre</a>
      <a href="contact.html" class="tag active">Contato</a>
      <button type="button" id="themeToggle" class="tag theme-toggle" aria-label="Alternar modo de cor" title="Modo de cor">
        <svg class="icon-moon" width="10" height="14" viewBox="0 0 5 7" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">
          <rect x="2" y="0" width="3" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="0" y="2" width="3" height="1"/><rect x="0" y="3" width="3" height="1"/><rect x="0" y="4" width="3" height="1"/><rect x="1" y="5" width="3" height="1"/><rect x="2" y="6" width="3" height="1"/>
        </svg>
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 7 7" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">
          <rect x="2" y="2" width="3" height="3"/><rect x="3" y="0" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/>
        </svg>
      </button>
    </nav>
  </header>

  <main class="main-wrapper p-2" style="padding-top: 10rem;">
    <p class="mono-label" style="margin-bottom: 1.5rem;"><span class="blink">▸</span> NEW GAME: INICIAR CONVERSA</p>
    <h1 class="h1-brutal">Fale<br>Comigo</h1>

    <!-- TROQUE O SEU ENDPOINT DO FORMSPREE ABAIXO -->
    <form action="https://formspree.io/f/seu-endpoint-aqui" method="POST">
      <input type="text" name="name" placeholder="Seu Nome" required>
      <input type="email" name="email" placeholder="Seu Email" required>
      <textarea name="message" rows="3" placeholder="Sua Mensagem" required></textarea>
      <button type="submit">Enviar Mensagem ▸</button>
    </form>
  </main>

  <footer>
    <a href="mailto:seuemail@dominio.com">Vamos Conversar ↗</a>
    <span class="footer-egg">© 2026 · INSERT COFFEE TO CONTINUE</span>
  </footer>

  <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
